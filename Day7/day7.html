<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
        flex box 
        it is a one dimensional layout model that is used
        to create web layouts

        
        
        flex-container(parent)
        1) display:flex
        it is used to create flex box -it will change the direction of childs into
        single row

        .parent{
            display:flex;
        }

        2) gap
        it is used to create the space
        gap:20px;

        3) flex-direction
        it is used to control the child directions
        flex-direction:column;
        flex-direction:column-reverse;
        flex-direction:row-reverse;
        flex-direction:row;---by default


        4) justify-content
        it is used to contrl the alignment of child items on main axis
        justify-content:center;
        justify-content:end;
        justify-content:space-evenly;
        justify-content:space-around;
        justify-content:space-between;
        justify-content:start;

        5) align-items
        it is used to align the items on cross axis
        align-items:start;  
        align-items:center; 
        align-items:end;    
        align-items:stretch;  
        
        6) flex-wrap
        it is used to wrap the items to the next row
        flex-wrap:wrap;   
        flex-wrap:wrap-reverse;
        
        7) align-content
        it is used to align the items on cross axis when there is a more than one row
        align-content:center; 
        align-content:end; 
        align-content:start; 
        align-content:space-between; 
        align-content:space-around; 
        align-content:space-evenly; 
        
        8)flex-flow
        it is a shorthand for wrap and direction
        flex-flow:wrap row-reverse;
        flex-flow:wrap-reverse column;

        flex-items(child)
        1) flex-basis
        it specifies initial length of an item

        */
        
        .parent{
        height:80vh;
        border:2px solid blue;
        display:flex;
        gap:10px;
        flex-direction:column;
        flex-direction:column-reverse;
        flex-direction:row-reverse;
        flex-direction:row;
        justify-content:center;
        justify-content:end;
        justify-content:space-evenly;
        justify-content:space-around;
        justify-content:space-between;
        justify-content:start;  
        align-items:start;  
        align-items:center; 
        align-items:end;    
        align-items:stretch; 
        flex-wrap:wrap;   
        /* flex-wrap:wrap-reverse;   */
        align-content:center; 
        align-content:end; 
        align-content:start; 
        align-content:space-between; 
        align-content:space-around; 
        align-content:space-evenly; 
        
        }
        .child{
            background:lightsalmon;
            padding:20px;
            flex-basis:25%;
        }
        #demo{
            order:-1;
        }
    </style>
</head>
<body>
    <div class="parent">
    <div class="child">child 1</div>
    <div class="child">child 2</div>
    <div class="child">child 3</div>
    <div class="child">child 4</div>
    <div class="child">child 5</div>
    <div class="child">child 6</div>
    <div class="child">child 7</div>
    <div class="child" id="demo">child 8</div>
    <div class="child">child 9</div>
    <div class="child">child 10</div>
    </div>
    
</body>
</html>
