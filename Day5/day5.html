<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Day5</title>

        <style>
            div{
                background:green;
                width:300px;
                height:200px;
                padding:20px;
                margin:30px;
                border: 7px solid black;
                display:inline-block;
                transition: all 0.5s;

            }
            div:hover{
                background:blue;
                color:white;
                border: 7px solid red;
                transform:translate(20px,10px);
                transform:rotate(-3900deg);
                transform:scale(1.5);
                transform:rotate(-3900deg) scale(-1.5);
            }
            h1{
                text-align:right;
                text-align:center;
                text-shadow: 0px 0px 9px rgb(154, 33, 33);
            
            }
            p{
                letter-spacing: 5px;
                word-spacing: 10px;
                line-height: 1.5;
                font-size: 20px;
                font-style: italic;
                font-family:cursive
            }
            span{
                color:rgb(234, 6, 36);
            }
        </style>
    </head>
    <body>
        <h1>HEADER</h1>
        <p>lorem ipsum dolor<br> sit amet</p>
        <div>box1</div>
        <div>box2</div>
        <p>lorem ipsum <span>dolor sit amet</span></p>

    </body>
</html>
