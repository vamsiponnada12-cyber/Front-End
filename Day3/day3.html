<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">

        <lable for="name">Enter Name:</lable>
        <input type="text" id="name" name="name" placeholder="name"><br><br>
        <label for="pwd">Enter password:</label>
        <input  required type="password" id="pwd" name="password" placeholder="password"><br><br>
        enter email:
        <input type="email"><br><br>
        enter number:
        <input type="number"><br><br>
        book your appointment:
        <input type="date"><br><br>
        book your slot:
        <input type="datetime-local"><br><br>
        upload your files:
        <input type="file"><br><br>
        give feedback:
        <input type="range"><br>
        reset:
        <input type="reset">
        submit:
        <input type="submit"><br><br>


    </form>

    <form action="">

        <p>Choose your stack:</p>

        <input type="radio" id="python" name="stack" value="python">
        <label for="python">Python stack</label><br>

        <input type="radio" id="java" name="stack" value="java">
        <label for="java">Java stack</label><br>

        <input type="radio" id="mern" name="stack" value="mern">
        <label for="mern">MERN stack</label><br>


        <p></p>choose your skills<br>

        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>
        <br>
        select your branch:
        <select value="branch" id="">
            <option value="vizag">Vizag</option>
            <option value="hyd">Hyderabad</option>
        </select>

        <button type="submit">Submit</button><br>
    </form>


</body>
