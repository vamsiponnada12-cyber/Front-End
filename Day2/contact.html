<!DOCTYPE html>
<html>
<head>
    <title>Tree Diagram</title>

    <style>
        .tree {
            text-align: center;
            font-family: Arial;
        }

        .circle {
            width: 150px;
            height: 100px;
            border-radius: 50%;
            background-color: rgb(23, 131, 45);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            text-transform: uppercase;
            

        }

        .line {
            width:2px;
            height: 30px;
            background-color: black;
            margin: auto;
        }

        .branches {
            display: flex;
            justify-content: center;
        }

        .branch {
            margin: 0 40px;
        }
    </style>
</head>

<body>

<div class="tree">

    <!-- Main Box -->
    <div class="circle">College</div>
    <div class="line"></div>    
    <div class="circle">faculty</div>
    
    <!-- Vertical Line -->
    <div class="line"></div><hr width="180px" color="black">

    <!-- Branches -->
    <div class="branches">

        <div class="branch">
            <div class="circle">CSE</div>
            <div class="line"></div>

            <div class="circle">Python</div>
        </div>

        <div class="branch">
            <div class="circle">AI</div>

            <div class="line"></div>

            <div class="circle">Machine Learning</div>
        </div>

    </div>

</div>

</body>
</html>
